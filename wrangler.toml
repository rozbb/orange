name = "orange-waict-demo"

account_id = "022362f27de5264a50ce60cb23293c9f"
main = "./build/index.js"
# https://developers.cloudflare.com/workers/platform/compatibility-dates
compatibility_date = "2024-10-07"
compatibility_flags = ["nodejs_compat"]

[site]
  bucket = "./public"

[[build.upload.rules]]
type = "ESModule"
globs = ["**/*.js"]

[route]
pattern = "orange-waict-demo.cloudflareresearch.com"
custom_domain = true

[vars]
CALLS_APP_ID = "c75b5a0e4fd4a2f5791effbe25022766"
TURN_SERVICE_ID = "f9ca89b874329c4fd7afad91864fc903"
PUBLIC = "true"
E2EE_ENABLED = "true"

[[durable_objects.bindings]]
name = "rooms"
class_name = "ChatRoom"

# Indicate that you want the ChatRoom and RateLimiter classes to be callable as Durable Objects.
[[migrations]]
tag = "v1" # Should be unique for each entry
new_classes = ["ChatRoom", "RateLimiter"]

[[migrations]]
tag = "v2"
deleted_classes = ["RateLimiter"] 

# The necessary secrets are:
# - CALLS_APP_SECRET
# Run `echo <VALUE> | wrangler secret put <NAME>` for each of these


